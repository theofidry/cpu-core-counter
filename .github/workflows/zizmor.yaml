name: "GitHub Actions Security"

on: # yamllint disable-line rule:truthy
    push:
        branches:
            - "main"
    pull_request: null
    schedule:
        # Do not make it the first of the month and/or midnight since it is a very busy time
        - cron: "0 10 5 * *"

# See https://stackoverflow.com/a/72408109
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read"

jobs:
    zizmor:
        runs-on: "ubuntu-latest"
        name: "Zizmor"
        steps:
            -   name: "Check out repository code"
                uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
                with:
                    persist-credentials: false

            -   name: "Run zizmor"
                uses: "zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482" # v0.6.4
                with:
                    # Fail the job on findings instead of only uploading them
                    # to the code scanning tab.
                    advanced-security: false
                    # Keep in sync with ZIZMOR_VERSION in the Makefile.
                    version: "1.30.1"

    # This is a "trick", a meta task which does not change, and we can use in
    # the protected branch rules as opposed to the individual tests which
    # may change regularly.
    validate-tests:
        name: "GitHub Actions Security Status"
        runs-on: "ubuntu-latest"
        needs:
            - "zizmor"
        if: "always()"
        steps:
            - name: "Successful run"
              if: "${{ !(contains(needs.*.result, 'failure')) }}"
              run: "exit 0"

            - name: "Failing run"
              if: "${{ contains(needs.*.result, 'failure') }}"
              run: "exit 1"
